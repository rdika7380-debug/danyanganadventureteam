<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <link rel="manifest" href="/testpwa/manifest.json">
    <link rel="apple-touch-icon" href="/testpwa/icon-192.png">
    <link rel="icon" type="image/png" href="/testpwa/icon-192.png">
    
    <title>Aplikasi GAS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        :root {
            --app-height: 100dvh;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --bg-base: #000000;
        }

        html, body {
            width: 100%;
            height: var(--app-height, 100dvh);
            overflow: hidden;
            background-color: var(--bg-base);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            color: #ffffff;
            position: fixed;
            top: 0;
            left: 0;
        }

        #app-iframe {
            position: fixed; 
            top: 0; 
            left: 0;
            width: 100%; 
            height: var(--app-height, 100dvh);
            border: none; 
            display: block; 
            background: #000000; 
            z-index: 1;
        }

        /* Loading Screen Modern */
        #loading-screen {
            position: fixed; 
            inset: 0; 
            background-color: #000000;
            z-index: 10; 
            transition: opacity 0.6s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        #loading-screen.hidden { 
            opacity: 0; 
            pointer-events: none; 
        }

        .loader-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Fallback Screen */
        #fallback-screen { 
            position: fixed; 
            inset: 0; 
            background-color: #000000;
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 24px; 
            z-index: 20; 
        }
        
        #fallback-screen.visible { 
            display: flex; 
        }

        .fallback-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .fallback-icon {
            font-size: 3rem;
            color: #f43f5e;
            margin-bottom: 1rem;
        }
        
        .fallback-title { 
            font-size: 1.25rem; 
            font-weight: 700; 
            margin-bottom: 0.75rem; 
        }
        
        .fallback-desc { 
            font-size: 0.875rem; 
            color: #64748b; 
            margin-bottom: 1.5rem; 
            line-height: 1.6; 
        }
        
        .fallback-btn { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1.5rem; 
            background: #000000; 
            color: #ffffff; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 0.875rem;
            width: 100%;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .fallback-btn:active { 
            transform: scale(0.97); 
            background-color: #222222;
        }
    </style>
</head>
<body>
    <!-- Loading Screen dengan Spinner -->
    <div id="loading-screen">
        <div class="loader-wrapper">
            <div class="spinner"></div>
        </div>
        <div class="loading-text">Memuat Aplikasi...</div>
    </div>

    <!-- Iframe Aplikasi -->
    <iframe id="app-iframe" src="about:blank" allow="fullscreen; autoplay; camera; microphone; geolocation" allowfullscreen></iframe>

    <!-- Fallback Screen -->
    <div id="fallback-screen">
        <div class="fallback-card">
            <i class="ph-fill ph-warning-circle fallback-icon"></i>
            <h2 class="fallback-title">Gagal Memuat Aplikasi</h2>
            <p class="fallback-desc">Server membutuhkan waktu terlalu lama untuk merespons. Pastikan koneksi internet Anda stabil, lalu coba buka aplikasi langsung.</p>
            <a href="#" id="fallback-link" class="fallback-btn" target="_blank" rel="noopener noreferrer">
                <i class="ph-bold ph-arrow-square-out"></i>
                Buka Aplikasi Langsung
            </a>
        </div>
    </div>

    <script>
        var GAS_URL = 'https://script.google.com/macros/s/AKfycbyz2pwxmYij6wq1-9KXDMqUiif_xGgbmFtO8LeAVcDZtwrN--yGBNC7PSc_bqIsAjxxlw/exec';

        var loadingScreen = document.getElementById('loading-screen');
        var fallbackScreen = document.getElementById('fallback-screen');
        var fallbackLink = document.getElementById('fallback-link');
        var iframe = document.getElementById('app-iframe');

        // 1. Perbaikan Tinggi iOS (100vh Problem)
        function setTrueAppHeight() {
            document.documentElement.style.setProperty('--app-height', window.screen.height + 'px');
        }
        setTrueAppHeight();
        window.addEventListener('resize', setTrueAppHeight);
        window.addEventListener('orientationchange', function(){ 
            setTimeout(setTrueAppHeight, 300); 
        });

        // 2. Baca safe area dari wrapper (top-level)
        function getInsets() {
            var s = getComputedStyle(document.documentElement);
            return {
                type: 'safe-area',
                top:    parseInt(s.getPropertyValue('--safe-top'))    || 0,
                bottom: parseInt(s.getPropertyValue('--safe-bottom')) || 0,
                left:   parseInt(s.getPropertyValue('--safe-left'))   || 0,
                right:  parseInt(s.getPropertyValue('--safe-right'))  || 0,
                viewportHeight: window.innerHeight,
                screenHeight: window.screen.height
            };
        }

        // 3. JALUR 1: URL parameter saat inisialisasi
        (function initIframe() {
            var i = getInsets();
            var targetUrl = GAS_URL + '?st=' + i.top + '&sb=' + i.bottom + '&sl=' + i.left + '&sr=' + i.right;
            iframe.src = targetUrl;
            fallbackLink.href = targetUrl; // Fallback mengarah ke URL yang sama (dengan parameter safe area)
        })();

        // 4. JALUR 2: postMessage
        function sendSafeArea() {
            if (iframe && iframe.contentWindow) {
                try { 
                    iframe.contentWindow.postMessage(getInsets(), '*'); 
                } catch (e) {}
            }
        }

        // 5. JALUR 3: Respons jika iframe meminta data safe-area
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'request-safe-area') {
                sendSafeArea();
            }
        });

        // Event listener global untuk kirim ulang data
        window.addEventListener('resize', sendSafeArea);
        window.addEventListener('orientationchange', function () {
            setTimeout(sendSafeArea, 300); 
            setTimeout(sendSafeArea, 600);
        });
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) setTimeout(sendSafeArea, 100);
        });

        // 6. Iframe Onload Logic
        iframe.onload = function() {
            loadingScreen.classList.add('hidden');
            sendSafeArea();
            // Kirim ulang beberapa kali untuk memastikan iframe menerima
            setTimeout(sendSafeArea, 500);
            setTimeout(sendSafeArea, 1500);
        };

        // 7. Ticker berkala 8 detik pertama (Jaga-jaga jika load asynchronous GAS lambat)
        var n = 0;
        var ticker = setInterval(function () { 
            sendSafeArea(); 
            if (++n > 8) clearInterval(ticker); 
        }, 1000);

        // 8. Fallback Timer 10 detik
        setTimeout(function() {
            if (!loadingScreen.classList.contains('hidden')) {
                loadingScreen.classList.add('hidden');
                fallbackScreen.classList.add('visible');
            }
        }, 10000);
    </script>
</body>
</html>
