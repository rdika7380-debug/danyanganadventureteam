<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <link rel="manifest" href="/testpwa/manifest.json">
    
    <title>Aplikasi GAS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">

    <style>
        :root {
            --app-height: 100%;
            --safe-area-top: env(safe-area-inset-top);
            --safe-area-bottom: env(safe-area-inset-bottom);
            --safe-area-left: env(safe-area-inset-left);
            --safe-area-right: env(safe-area-inset-right);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: var(--app-height);
            background-color: #000000;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        #gas-iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--app-height);
            border: none;
            background-color: #000000;
            padding-top: var(--safe-area-top);
            padding-bottom: var(--safe-area-bottom);
            padding-left: var(--safe-area-left);
            padding-right: var(--safe-area-right);
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            inset: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Fallback Screen */
        #fallback-screen {
            position: fixed;
            inset: 0;
            background-color: #000000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
            text-align: center;
        }

        .fallback-card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .fallback-icon {
            font-size: 64px;
            color: #000000;
        }

        .fallback-title {
            font-size: 22px;
            font-weight: 700;
            color: #111111;
        }

        .fallback-text {
            font-size: 14px;
            color: #555555;
            line-height: 1.5;
            font-weight: 300;
        }

        .fallback-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 15px;
            width: 100%;
            transition: transform 0.2s, background-color 0.2s;
        }

        .fallback-btn:active {
            transform: scale(0.97);
            background-color: #222222;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
    </div>

    <!-- Fallback Screen -->
    <div id="fallback-screen">
        <div class="fallback-card">
            <i class="ph ph-warning-circle fallback-icon"></i>
            <div class="fallback-title">Koneksi Terputus</div>
            <div class="fallback-text">
                Aplikasi membutuhkan waktu terlalu lama untuk dimuat. Ini mungkin disebabkan oleh koneksi internet yang lambat atau server sedang sibuk.
            </div>
            <a href="#" id="fallback-link" class="fallback-btn">
                <i class="ph ph-arrow-square-out"></i>
                Buka Aplikasi Langsung
            </a>
        </div>
    </div>

    <!-- Iframe Wrapper -->
    <iframe id="gas-iframe" allow="fullscreen; autoplay; camera; microphone; geolocation" allowfullscreen></iframe>

    <script>
        // Variabel URL Google Apps Script Target
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyz2pwxmYij6wq1-9KXDMqUiif_xGgbmFtO8LeAVcDZtwrN--yGBNC7PSc_bqIsAjxxlw/exec";

        const loadingScreen = document.getElementById('loading-screen');
        const fallbackScreen = document.getElementById('fallback-screen');
        const fallbackLink = document.getElementById('fallback-link');
        const iframe = document.getElementById('gas-iframe');

        let fallbackTimer;
        let isIframeLoaded = false;

        // 1. Perbaikan Tinggi iOS (100vh Problem)
        function setAppHeight() {
            document.documentElement.style.setProperty('--app-height', `${window.screen.height}px`);
        }
        setAppHeight();

        // 2. Komunikasi Safe-Area: Dapatkan nilai Env / Computed Style
        function getSafeAreaInsets() {
            const div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.top = 'env(safe-area-inset-top)';
            div.style.bottom = 'env(safe-area-inset-bottom)';
            div.style.left = 'env(safe-area-inset-left)';
            div.style.right = 'env(safe-area-inset-right)';
            document.body.appendChild(div);
            
            const styles = window.getComputedStyle(div);
            const insets = {
                top: parseInt(styles.top) || 0,
                bottom: parseInt(styles.bottom) || 0,
                left: parseInt(styles.left) || 0,
                right: parseInt(styles.right) || 0
            };
            
            document.body.removeChild(div);
            return insets;
        }

        // 3. Sistem Komunikasi 3 Jalur
        function sendSafeAreaToIframe() {
            const insets = getSafeAreaInsets();
            
            // Kirim via PostMessage (Jalur 2)
            const payload = {
                type: 'safe-area-data',
                insets: insets
            };
            
            if (iframe.contentWindow) {
                iframe.contentWindow.postMessage(payload, '*');
            }
        }

        // Event Listener menerima request dari iframe (Jalur 3)
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'request-safe-area') {
                sendSafeAreaToIframe();
            }
        });

        // Event resize, orientationchange, visibilitychange
        ['resize', 'orientationchange', 'visibilitychange'].forEach(evt => {
            window.addEventListener(evt, () => {
                setAppHeight();
                sendSafeAreaToIframe();
            });
        });

        // 4. Setup Iframe (Jalur 1 - URL Parameter) & Fallback Logic
        function initializeIframe() {
            const insets = getSafeAreaInsets();
            const url = new URL(GAS_URL);
            
            // Tambahkan parameter safe area
            url.searchParams.append('st', insets.top);
            url.searchParams.append('sb', insets.bottom);
            url.searchParams.append('sl', insets.left);
            url.searchParams.append('sr', insets.right);
            
            // Set href fallback link
            fallbackLink.href = GAS_URL;

            // Set src iframe
            iframe.src = url.toString();

            // Fallback timer 10 detik
            fallbackTimer = setTimeout(() => {
                if (!isIframeLoaded) {
                    loadingScreen.style.display = 'none';
                    fallbackScreen.style.display = 'flex';
                }
            }, 10000);
        }

        // Iframe onload: Hilangkan loading & batalkan fallback
        iframe.onload = function() {
            isIframeLoaded = true;
            clearTimeout(fallbackTimer);
            
            // Kirim ulang safe area saat iframe selesai dimuat
            sendSafeAreaToIframe();

            // Fade out loading screen
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 500);
        };

        // Mulai proses
        initializeIframe();
    </script>
</body>
</html>
